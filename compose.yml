services:
  db:
    image: postgres:16-alpine
    container_name: linkforge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: linkforge
      POSTGRES_USER: linkforge
      POSTGRES_PASSWORD: devpassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgressql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U linkforge -d linkforge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: