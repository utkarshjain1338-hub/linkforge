name: Pulish linkforge to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
     runs-on: ubuntu-latest
     if: github.event_name == 'workflow_dispatch' || github.event.pull_request == null
     permissions:
       contents: read
       package: write

     steps:
       - name: Checkout code
         uses: actions/checkout@v4

       - name: set up docker buildx
         uses: docker/setup-buildx-action@v3

       - name: log in to GHCR
         uses: docker/login-action@v3
         with:
           registry: ghcr.io   
           username: ${{ github.actor }}
           password: ${{ secret.GITHUB_TOKEN }}

       - name: build and push image
         uses: docker/build-push-action@v6
         with:
           context: .
           push: true
           tags: |
              ghcr.io/utkarshjain1338-hub/linkforge:latest
              ghcr.io/utkarshjain1338-hub/linkforge:${{ github.sha }}         