name: LinkForge CI

on:
  push:
   branches: [main]
  pull_request:
   branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Set up Go
       uses: actions/setup-go@v5
       with:
          go-version-file: go.mod
          cache: true

     - name: Checkout Go Vulnerabilities
       uses: goland/govulcheck-action@v1
       with:
          go-verison-file: go.mod

     - name: Build Go application
       run: go build ./...

     - name: build Docker image
       run: docker build -t linkforge:test .

     - name: Scan project with Trivy
       uses: aquasecurity/trivy-action@0.28.0
       with:
         scan-type: fs
         scan-ref: .
         scanners: vuln,secret,misconfig
         severity: HIGH,CRITICAL
         exit-code: '1'
         ignore-unfixed: true           

     - name: Scan Docker image with Trivy
       uses: aquasecurity/trivy-action@0.28.0
       with: 
         scan-type: image
         image-ref: linkforge
         scanners: vuln
         severity: HIGH,CRITICAL
         exit-code: '1'
         ignore-unfixed: true 