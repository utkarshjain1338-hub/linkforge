name: LinkForge CI

on:
  push:
   branches: [main]
  pull_request:
   branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Set up Go
       uses: actions/setup-go@v5
       with:
          go-version-file: go.mod
          cache: true

     - name: Run tests
       run: go test ./...

     - name: Build Go application
       run: go build ./...

     - name: Build Docker image
       run: docker build -t linkforge:test .